name: Check forecasts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s toolkit/tests -v
      - name: Verify personal forecast ledger template
        run: |
          python toolkit/pipeline.py --case my-forecasts check
          python toolkit/pipeline.py --case my-forecasts report
          git diff --exit-code -- my-forecasts
      - name: Verify each archive case
        run: |
          for case_dir in cases/*; do
            test -f "$case_dir/config.json" || continue
            python toolkit/pipeline.py --case "$case_dir" check
            python toolkit/pipeline.py --case "$case_dir" report
          done
          git diff --exit-code -- cases
